name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff on earnings-service
        run: ruff check earnings-service/

      - name: Run Ruff on anomaly-service
        run: ruff check anomaly-service/

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies for earnings-service
        run: |
          cd earnings-service
          pip install -r requirements.txt

      - name: Run earnings-service unit tests
        run: |
          cd earnings-service
          python -m pytest tests/ -v

      - name: Install dependencies for anomaly-service
        run: |
          cd anomaly-service
          pip install -r requirements.txt

      - name: Run anomaly-service unit tests
        run: |
          cd anomaly-service
          python -m pytest tests/ -v

  integration-tests:
    name: Integration Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fairgig_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "PostgreSQL is ready"
              break
            fi
            sleep 2
          done

      - name: Apply database schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d fairgig_test -f db/schema.sql

      - name: Install dependencies for earnings-service
        run: |
          cd earnings-service
          pip install -r requirements.txt

      - name: Run earnings-service integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fairgig_test
          JWT_SECRET_KEY: test-secret-key-for-ci-only
        run: |
          cd earnings-service
          python -m pytest tests_integration/ -v

      - name: Install dependencies for anomaly-service
        run: |
          cd anomaly-service
          pip install -r requirements.txt

      - name: Run anomaly-service integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fairgig_test
          JWT_SECRET_KEY: test-secret-key-for-ci-only
        run: |
          cd anomaly-service
          python -m pytest tests_integration/ -v